[tool.poetry]
name = "parking-chatbot"
version = "0.1.0"
description = "Intelligent parking reservation chatbot - RAG + Human-in-the-loop + MCP + LangGraph orchestration"
authors = ["Vegesh"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

langchain = "^1.0"
langchain-openai = "*"
langchain-community = "*"
langchain-text-splitters = "*"
langchain-classic = "*"
langgraph = "*"

pymilvus = "*"

faker = "*"
fpdf2 = "*"
pypdf = "*"

trulens = "*"
trulens-apps-langchain = "*"
trulens-providers-openai = "*"
trulens-dashboard = "*"

python-dotenv = "*"
pandas = "*"
python-dateutil = "*"
langchain-milvus = "*"

fastapi = "*"
uvicorn = "*"
langgraph-checkpoint-sqlite = "*"

langchain-mcp-adapters = "*"
mcp = "*"

presidio-analyzer = "*"
presidio-anonymizer = "*"
spacy = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-mock = "*"
langgraph-cli = {extras = ["inmem"], version = "^0.4.31"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"