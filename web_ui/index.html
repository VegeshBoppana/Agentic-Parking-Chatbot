<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SkyPark Parking Assistant</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 40px auto;
    background: #f4f6f8;
    color: #1a1a1a;
  }
  h2 {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2::before {
    content: "🅿️";
  }
  #chat {
    background: white;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    height: 480px;
    overflow-y: auto;
    padding: 16px;
    margin-bottom: 12px;
  }
  .row {
    display: flex;
    margin: 10px 0;
  }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .bubble.user {
    background: #0060df;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble.bot {
    background: #eef1f4;
    color: #1a1a1a;
    border-bottom-left-radius: 4px;
  }
  .bubble.bot ul { margin: 6px 0; padding-left: 20px; }
  .bubble.bot b { font-weight: 600; }
  .typing {
    font-style: italic;
    color: #888;
  }
  #input-row {
    display: flex;
    gap: 8px;
  }
  #input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 20px;
    font-size: 14px;
  }
  #input:focus { outline: 2px solid #0060df; }
  #send {
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: #0060df;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  #send:disabled {
    background: #9ab8ea;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<h2>SkyPark Parking Assistant</h2>
<div id="chat"></div>
<div id="input-row">
  <input id="input" type="text" placeholder="Type a message..." autocomplete="off" />
  <button id="send">Send</button>
</div>

<script>
const threadId = crypto.randomUUID();
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
let sending = false;

function renderMarkdown(text) {
  let html = text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

  const lines = html.split("\n");
  let out = "";
  let inList = false;
  for (const line of lines) {
    const trimmed = line.trim();
    if (/^[-*]\s+/.test(trimmed) || /^\d+\.\s+/.test(trimmed)) {
      if (!inList) { out += "<ul>"; inList = true; }
      out += "<li>" + trimmed.replace(/^[-*]\s+/, "").replace(/^\d+\.\s+/, "") + "</li>";
    } else {
      if (inList) { out += "</ul>"; inList = false; }
      out += (trimmed ? trimmed + "<br>" : "<br>");
    }
  }
  if (inList) out += "</ul>";
  return out;
}

function addMessage(text, who) {
  const row = document.createElement("div");
  row.className = "row " + who;
  const bubble = document.createElement("div");
  bubble.className = "bubble " + who;
  if (who === "bot") {
    bubble.innerHTML = renderMarkdown(text);
  } else {
    bubble.textContent = text;
  }
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

function addTyping() {
  const row = document.createElement("div");
  row.className = "row bot";
  row.id = "typing-row";
  row.innerHTML = '<div class="bubble bot typing">Bot is typing...</div>';
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const row = document.getElementById("typing-row");
  if (row) row.remove();
}

async function sendMessage() {
  if (sending) return;
  const text = input.value.trim();
  if (!text) return;

  sending = true;
  sendBtn.disabled = true;
  input.disabled = true;

  addMessage(text, "user");
  input.value = "";
  addTyping();

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ thread_id: threadId, message: text }),
    });
    const data = await res.json();
    removeTyping();
    addMessage(data.reply, "bot");
  } catch (err) {
    removeTyping();
    addMessage("Sorry, something went wrong. Please try again.", "bot");
  } finally {
    sending = false;
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

addMessage("Hello! How can I assist you with your parking needs today?", "bot");
</script>
</body>
</html>
